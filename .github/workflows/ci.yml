name: CI

# Every "verified" claim in docs/PROGRESS.md was a one-time manual check on one
# machine. This makes the cheap, machine-checkable ones permanent.
#
# Staged by cost: typecheck and unit tests run in seconds and catch the class of
# defect that has cost this project the most time (float money, waste
# double-counting, cascade ordering). The browser suites need a database and are
# therefore a separate, slower job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` input on purpose. Supplying one alongside the
      # `packageManager` field in package.json makes action-setup v4 error with
      # two sources of truth, which is why every run until now died here
      # before a single test executed.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter web typecheck

      # Fast and dependency-free: the engines are pure functions.
      - name: Unit tests
        run: pnpm --filter web test:unit

      # eslint was in package.json from the first week and never installed, so
      # `pnpm lint` failed and reported nothing — a check that cannot run is
      # worse than no check, because it appears in the script list and
      # everybody assumes somebody runs it.
      - name: Lint
        run: pnpm --filter web lint

      - name: Production build
        run: pnpm --filter web build

      # The guard in vite.config.ts is the only thing standing between a
      # missing environment variable and a deployment that serves the mock
      # catalogue as though it were the venue's own data. An unexercised
      # guard is an assumption, so this asserts it: a Vercel production
      # build with the variables stripped must fail, and must fail for the
      # stated reason rather than by accident.
      - name: A production build without a database is refused
        env:
          VERCEL_ENV: production
        run: |
          set -o pipefail
          if pnpm --filter web build 2>&1 | tee /tmp/guard.log; then
            echo "::error::A production build without VITE_SUPABASE_* succeeded."
            echo "::error::It would serve the mock catalogue as real data. See vite.config.ts."
            exit 1
          fi
          grep -q "mock catalogue" /tmp/guard.log || {
            echo "::error::The build failed, but not on the database guard."
            echo "::error::Something else is broken and the guard is now untested."
            exit 1
          }
          echo "Refused, as it should be."

  browser:
    name: Accessibility and keyboard
    runs-on: ubuntu-latest
    # Only worth the minutes if the static gate already passed.
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      # The CLI was never installed before, and both database steps were
      # `continue-on-error`, so this job would sail past a missing Postgres and
      # run the suites against an app with nothing to show. A scan of an empty
      # page passes while proving nothing, which is worse than not scanning.
      # Pinned, not "latest". With `latest` the action resolves the newest
      # release on every run, and that lookup failed on two of the last three
      # — the job went red at the install step before a single test executed,
      # which reads exactly like a test regression and is not one.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start Supabase and build the demo venue
        run: |
          # `realtime` is in rather than excluded: 0127 publishes the
          # catalogue tables and the live-catalogue suite below is the only
          # thing that proves a colleague's edit reaches an open screen.
          supabase start -x imgproxy,pooler,studio,storage-api,edge-runtime
          # `db reset` alone applies the migrations and seed.sql and stops —
          # which is a venue with an owner and an empty catalogue. The visual
          # baselines are screenshots of the database this script builds, and
          # the a11y suites are worth more against it too: a contrast check on
          # an empty table proves nothing. It does the reset itself, then the
          # other six seeds in dependency order, then the costing pass without
          # which 115 recipes cost zero and the allergen matrix is blank.
          ./supabase/seed_local_demo.sh

      # The database controls, proved by trying to break them.
      #
      # Runs before the browser suites and before the app is even built,
      # because it needs nothing but the schema and it is the cheapest way to
      # discover that a trigger has gone missing. Everything it asserts was
      # previously proved once, by hand, in a scratch file nobody kept.
      - name: Database controls
        run: ./supabase/tests/run.sh "$(supabase status -o json | jq -r .DB_URL)"

      - name: Write env
        run: |
          {
            echo "VITE_SUPABASE_URL=$(supabase status -o json | jq -r .API_URL)"
            echo "VITE_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)"
          } > apps/web/.env.local
          # And into the job's environment, for the suites that talk to the
          # database directly rather than through the browser.
          {
            echo "SUPABASE_API_URL=$(supabase status -o json | jq -r .API_URL)"
            echo "SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)"
          } >> "$GITHUB_ENV"
          # Fail here rather than three steps later with an empty page.
          grep -q 'ANON_KEY=ey' apps/web/.env.local

      # Realtime is the one path that does not go through PostgREST, so none
      # of the 1.461 database checks covers it: a policy that holds for a REST
      # read and leaks over a websocket would be green in all of them. Three
      # subscribers, one changed row — the member is told, another venue is
      # not, and a client that never signed in gets no row content.
      - name: Realtime respects tenancy
        run: |
          export SUPABASE_URL="$(supabase status -o json | jq -r .API_URL)"
          export SUPABASE_ANON_KEY="$(supabase status -o json | jq -r .ANON_KEY)"
          node apps/web/scripts/realtime-probe.mjs

      # Chromium only: the iPad project is WebKit, and the two screen-reader
      # tests that read the accessibility tree over CDP cannot run there.
      - name: Accessibility, keyboard, screen-reader and live-catalogue suites
        env:
          # The specs read these from the environment; `.env.local` above is
          # for the dev server. `live-catalogue.spec.ts` fails rather than
          # skips when they are missing on CI.
          VITE_SUPABASE_URL: ${{ env.SUPABASE_API_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
        run: >
          pnpm --filter web exec playwright test
          accessibility.spec.ts keyboard.spec.ts screen-reader.spec.ts
          live-catalogue.spec.ts
          --project=desktop

      # The visual suite, which until now CI did not run at all — the
      # baselines were macOS-rendered and the exclusion was defensible, but it
      # left seventeen snapshots whose only check was somebody remembering to
      # run them. They had been stale for eight weeks once, and fifteen of the
      # seventeen were failing before anybody looked.
      #
      # It runs in a pinned container rather than on the runner, and the
      # baselines are bound to that image. Two Ubuntu machines do not render
      # text identically — font packages and fontconfig defaults move the
      # glyphs, and this suite is tuned to catch 0,2% of the pixels changing —
      # so a baseline taken on a laptop and checked on a runner is a coin
      # toss. Binding both ends to one image makes it a check.
      #
      # The same script a developer runs locally, deliberately: if CI and the
      # laptop disagree, the disagreement is in the database or the code and
      # not in the way the suite was invoked.
      - name: Visual regression, in the pinned Playwright image
        run: ./apps/web/scripts/visual-linux.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: apps/web/test-results/
          retention-days: 7

      # The production bundle, served with vercel.json's headers. Every other
      # browser check uses the dev server, which is how a build that loaded
      # to a blank page once passed CI.
      - name: Production build loads under the production headers
        run: |
          pnpm --filter web build
          node apps/web/scripts/serve-dist.mjs &
          for i in $(seq 1 20); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 0.5; done
          E2E_BASE_URL=http://localhost:4173 E2E_NO_SERVER=1 \
            pnpm --filter web exec playwright test production-smoke.spec.ts --project=desktop

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  reconcile:
    name: COGS golden master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Diffs the engine against the venue's own workbook figures. This is the
      # only non-circular check available: the expected values were produced by
      # a spreadsheet the code has never seen.
      - name: Reconcile against COGS V5
        run: pnpm --filter web reconcile
